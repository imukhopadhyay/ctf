<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberQuest CTF — Documentation</title>
  <meta name="description" content="Documentation for the CyberQuest CTF platform: architecture, security, deployment, API and admin guide." />
  <style>
    :root {
      --bg:#060a13; --surface:#0b1220; --surface2:#101a2c; --border:#1b2a42;
      --fg:#e6edf7; --muted:#8ea0ba; --primary:#2dd4bf; --accent:#22d3ee;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); }
    body {
      background-image:
        linear-gradient(rgba(45,212,191,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45,212,191,.035) 1px, transparent 1px);
      background-size:40px 40px; background-attachment:fixed;
    }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:.75rem;
      padding:.8rem 1rem; border-bottom:1px solid var(--border); background:rgba(6,10,19,.9); backdrop-filter:blur(6px); }
    header svg { width:28px; height:28px; }
    header .brand { font-family:var(--mono); font-weight:700; font-size:.95rem; }
    header .brand span { color:var(--primary); }
    header a.repo { margin-left:auto; color:var(--accent); text-decoration:none; font-size:.85rem; }
    .layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 57px); }
    nav { border-right:1px solid var(--border); padding:1rem; overflow-y:auto; }
    nav h2 { font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:.5rem 0; }
    nav a { display:block; padding:.4rem .6rem; border-radius:.4rem; color:var(--muted); text-decoration:none; font-size:.9rem; }
    nav a:hover { background:var(--surface2); color:var(--fg); }
    nav a.active { background:var(--surface2); color:var(--primary); font-weight:600; }
    main { padding:2rem clamp(1rem,4vw,3rem); max-width:900px; }
    #content { line-height:1.7; overflow-wrap:anywhere; }
    #content > :first-child { margin-top:0; }
    #content h1 { font-size:2rem; } #content h2 { font-size:1.4rem; margin-top:2rem; border-bottom:1px solid var(--border); padding-bottom:.3rem; }
    #content h3 { font-size:1.1rem; margin-top:1.5rem; }
    #content a { color:var(--accent); }
    #content code { font-family:var(--mono); font-size:.88em; background:var(--surface2); border:1px solid var(--border); padding:.1em .35em; border-radius:.3rem; }
    #content pre { background:#050911; border:1px solid var(--border); border-radius:.6rem; padding:1rem; overflow-x:auto; }
    #content pre code { background:none; border:0; padding:0; }
    #content table { border-collapse:collapse; width:100%; font-size:.9em; display:block; overflow-x:auto; }
    #content th,#content td { border:1px solid var(--border); padding:.4em .6em; text-align:left; }
    #content blockquote { border-left:3px solid var(--primary); margin:1rem 0; padding:.2rem 0 .2rem 1rem; color:var(--muted); }
    .banner { background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.4); color:#fbbf24; padding:.6rem .9rem; border-radius:.5rem; font-size:.85rem; margin-bottom:1.5rem; }
    .loading { color:var(--muted); }
    @media (max-width:760px){ .layout{ grid-template-columns:1fr; } nav{ border-right:0; border-bottom:1px solid var(--border); } }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.2 5.1 13.4 12 15 6.9-1.6 12-7.8 12-15V7L16 2Z" fill="none" stroke="var(--primary)" stroke-width="2"/><path d="M11 11v11M11 11h9l-2 3 2 3h-9" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>
    <span class="brand">Cyber<span>Quest</span> CTF — Docs</span>
    <a class="repo" id="repoLink" href="#" target="_blank" rel="noopener">View on GitHub →</a>
  </header>
  <div class="layout">
    <nav aria-label="Documentation"><h2>Documents</h2><div id="nav"></div></nav>
    <main>
      <div class="banner">This is the documentation site. CyberQuest is a server application (PostgreSQL + Redis) and does not run on GitHub Pages — see the Deployment guide to run it.</div>
      <article id="content"><p class="loading">Loading…</p></article>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const TITLES = {
      "docs/README.md": "Overview (README)",
      "docs/ARCHITECTURE.md": "Architecture",
      "docs/DATABASE.md": "Database design",
      "docs/API.md": "API reference",
      "docs/SECURITY.md": "Security & threat model",
      "docs/SANDBOX.md": "Challenge sandbox",
      "docs/DEPLOYMENT.md": "Deployment",
      "docs/ADMIN_GUIDE.md": "Admin & organizer guide",
      "docs/LIMITATIONS.md": "Known limitations",
    };
    const ORDER = ["docs/README.md","docs/ARCHITECTURE.md","docs/DATABASE.md","docs/API.md","docs/SECURITY.md","docs/SANDBOX.md","docs/DEPLOYMENT.md","docs/ADMIN_GUIDE.md","docs/LIMITATIONS.md"];
    // Derive the repo link from the Pages URL (user.github.io/repo → github.com/user/repo).
    try {
      const parts = location.pathname.split("/").filter(Boolean);
      const user = location.hostname.split(".")[0];
      document.getElementById("repoLink").href = parts.length ? `https://github.com/${user}/${parts[0]}` : `https://github.com/${user}`;
    } catch {}

    const navEl = document.getElementById("nav");
    const contentEl = document.getElementById("content");
    const cache = {};

    async function load(path, push = true) {
      document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.path === path));
      contentEl.innerHTML = '<p class="loading">Loading…</p>';
      try {
        if (!cache[path]) {
          const res = await fetch(path);
          if (!res.ok) throw new Error(res.status);
          cache[path] = await res.text();
        }
        contentEl.innerHTML = marked.parse(cache[path]);
        // Rewrite relative .md links to in-page navigation.
        contentEl.querySelectorAll('a[href$=".md"]').forEach(a => {
          const href = a.getAttribute("href").replace(/^\.?\//, "");
          const target = href.startsWith("docs/") ? href : "docs/" + href.split("/").pop();
          if (TITLES[target]) { a.addEventListener("click", e => { e.preventDefault(); load(target); }); }
        });
        window.scrollTo(0, 0);
        if (push) history.replaceState(null, "", "#" + path);
      } catch (e) {
        contentEl.innerHTML = '<p class="loading">Could not load ' + path + '.</p>';
      }
    }

    for (const path of ORDER) {
      const a = document.createElement("a");
      a.textContent = TITLES[path] || path;
      a.href = "#" + path; a.dataset.path = path;
      a.addEventListener("click", e => { e.preventDefault(); load(path); });
      navEl.appendChild(a);
    }
    const initial = decodeURIComponent(location.hash.slice(1));
    load(ORDER.includes(initial) ? initial : "docs/README.md", false);
  </script>
</body>
</html>
